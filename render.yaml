# Blueprint de Render: app Laravel (Docker) + PostgreSQL, ambos en el plan gratuito.
# En Render: New > Blueprint > elegir este repositorio.
services:
  - type: web
    name: transmetro
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./transmetro-app/Dockerfile
    dockerContext: ./transmetro-app
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Transmetro
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_LOCALE
        value: es
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: TRUSTED_PROXIES
        value: "*"
      - key: SEED_IF_EMPTY
        value: "true"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: transmetro-db
          property: connectionString

databases:
  - name: transmetro-db
    plan: free
    region: oregon
    databaseName: transmetro
    user: transmetro
